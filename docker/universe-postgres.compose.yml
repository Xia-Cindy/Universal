services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${UNIVERSE_POSTGRES_DB:-universe}
      POSTGRES_USER: ${UNIVERSE_POSTGRES_USER:-universe}
      POSTGRES_PASSWORD: ${UNIVERSE_POSTGRES_PASSWORD:?Set UNIVERSE_POSTGRES_PASSWORD in docker/universe.env}
    ports:
      - "${UNIVERSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - universe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  universe-postgres-data:
