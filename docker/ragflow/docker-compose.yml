name: universe-ragflow

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.4}
    platform: ${RAGFLOW_PLATFORM:-linux/amd64}
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${RAGFLOW_WEB_PORT:-8088}:80"
      - "${RAGFLOW_API_PORT:-9380}:9380"
      - "${RAGFLOW_ADMIN_PORT:-9381}:9381"
    environment:
      DOC_ENGINE: ${DOC_ENGINE:-elasticsearch}
      ES_HOST: es01
      ES_PORT: 9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      INFINITY_HOST: infinity
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DBNAME: ${MYSQL_DATABASE:-rag_flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
      SVR_HTTP_PORT: 9380
      REGISTER_ENABLED: ${REGISTER_ENABLED:-1}
      TZ: ${TZ:-Asia/Shanghai}
      MACOS: ${MACOS:-1}
      API_PROXY_SCHEME: ${API_PROXY_SCHEME:-python}
      ALLOW_ANY_HOST: ${ALLOW_ANY_HOST:-0}
      DOC_BULK_SIZE: ${DOC_BULK_SIZE:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
    volumes:
      - ragflow_logs:/ragflow/logs
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  es01:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.11.3}}
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tmpfs:
      - /tmp:mode=1777,size=512m
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  infinity:
    image: ${INFINITY_IMAGE:-infiniflow/infinity:v0.7.0}
    platform: ${INFINITY_PLATFORM:-linux/amd64}
    profiles:
      - infinity
    command: ["-f", "/infinity_conf.toml"]
    volumes:
      - infinity_data:/var/infinity
      - ./infinity_conf.toml:/infinity_conf.toml:ro
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.40}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --init-file=/data/application/init.sql
      - --binlog_expire_logs_seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_flow}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/data/application/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD:-infini_rag_flow}"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-valkey/valkey:8}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-infini_rag_flow}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-infini_rag_flow}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

volumes:
  esdata01:
  infinity_data:
  mysql_data:
  minio_data:
  redis_data:
  ragflow_logs:

networks:
  ragflow:
    driver: bridge
