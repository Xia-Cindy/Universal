services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${UNIVERSE_POSTGRES_DB}
      POSTGRES_USER: ${UNIVERSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UNIVERSE_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - universe_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${UNIVERSE_POSTGRES_USER}:${UNIVERSE_POSTGRES_PASSWORD}@db:5432/${UNIVERSE_POSTGRES_DB}
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-local}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_ID: ${RAGFLOW_DATASET_ID:-}
      RAGFLOW_DATASET_NAME: ${RAGFLOW_DATASET_NAME:-Universe OS Knowledge}
      RAGFLOW_TIMEOUT_SECONDS: ${RAGFLOW_TIMEOUT_SECONDS:-120}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-}
      AI_OPENAI_TIMEOUT_SECONDS: ${AI_OPENAI_TIMEOUT_SECONDS:-45}
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_ROOT: storage/objects
      EMAIL_BACKEND: console
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - universe_objects:/app/storage/objects

  room:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.room
      args:
        VITE_ENABLE_LOCAL_SYLVA: "false"
    depends_on:
      - api
    ports:
      - "${UNIVERSE_BIND_ADDRESS:-127.0.0.1}:${UNIVERSE_DEV_PORT:-15180}:80"
    restart: unless-stopped

volumes:
  universe_postgres:
  universe_objects:
